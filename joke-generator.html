<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <title>Random Joke Generator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #eef4ff;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 18% 12%, rgba(13, 110, 253, .2), transparent 38%),
          radial-gradient(ellipse at 90% 85%, rgba(30, 165, 165, .16), transparent 36%),
          #0b1220;
      }
      .card {
        width: min(100%, 620px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #25344a;
        border-radius: 24px;
        background: rgba(16, 24, 39, .92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #55c8d0;
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -.05em; }
      .intro { margin: 12px 0 32px; color: #a9b8cb; line-height: 1.65; }
      .joke-box {
        min-height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        border: 1px solid #263850;
        border-radius: 18px;
        background: #111d2e;
      }
      .joke-type { color: #8fa6c3; font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
      .joke-text { margin: 0; color: #f2f6fc; font-size: clamp(1.15rem, 3vw, 1.45rem); line-height: 1.6; }
      .punchline { color: #55c8d0; font-weight: 700; }
      .status { min-height: 24px; margin: 16px 0 0; color: #a9b8cb; font-size: .9rem; }
      .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #0d6efd, #0b4fc4);
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition: transform .18s ease, opacity .18s ease;
      }
      button:hover:not(:disabled) { transform: translateY(-2px); }
      button:focus-visible { outline: 3px solid #55c8d0; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .65; }
      .note { margin: 22px 0 0; color: #71839b; font-size: .8rem; }
      @media (max-width: 480px) {
        .actions { align-items: stretch; flex-direction: column; }
        button { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A little break</p>
      <h1>Random Joke Generator</h1>
      <p class="intro">Need a quick laugh? Get a fresh two-part joke from the Official Joke API.</p>

      <section class="joke-box" aria-live="polite" aria-atomic="true" aria-label="Random joke">
        <span class="joke-type" id="jokeType">Ready when you are</span>
        <p class="joke-text" id="jokeSetup">Click the button to get a joke.</p>
        <p class="joke-text punchline" id="jokePunchline"></p>
      </section>

      <p class="status" id="status" role="status"></p>
      <div class="actions">
        <button id="newJokeButton" type="button">Tell me a joke</button>
      </div>
      <p class="note">Jokes provided by <a href="https://official-joke-api.appspot.com/" target="_blank" rel="noreferrer" style="color:#8fa6c3">Official Joke API</a>.</p>
    </main>

    <script>
      const button = document.getElementById('newJokeButton');
      const typeElement = document.getElementById('jokeType');
      const setupElement = document.getElementById('jokeSetup');
      const punchlineElement = document.getElementById('jokePunchline');
      const statusElement = document.getElementById('status');

      async function getJoke() {
        button.disabled = true;
        button.textContent = 'Finding a joke…';
        statusElement.textContent = 'Loading a fresh joke.';
        typeElement.textContent = 'One moment';
        setupElement.textContent = 'Getting something funny…';
        punchlineElement.textContent = '';

        try {
          const response = await fetch('https://official-joke-api.appspot.com/random_joke', {
            headers: { Accept: 'application/json' }
          });
          if (!response.ok) throw new Error(`Joke service returned ${response.status}`);

          const joke = await response.json();
          if (!joke || typeof joke.setup !== 'string' || typeof joke.punchline !== 'string') {
            throw new Error('The joke service returned an unexpected response.');
          }

          typeElement.textContent = joke.type || 'Random joke';
          setupElement.textContent = joke.setup;
          punchlineElement.textContent = joke.punchline;
          statusElement.textContent = '';
        } catch (error) {
          typeElement.textContent = 'Could not load a joke';
          setupElement.textContent = 'The joke service is unavailable right now.';
          punchlineElement.textContent = '';
          statusElement.textContent = 'Check your internet connection and try again.';
        } finally {
          button.disabled = false;
          button.textContent = 'Tell me another';
        }
      }

      button.addEventListener('click', getJoke);
    </script>
  </body>
</html>
